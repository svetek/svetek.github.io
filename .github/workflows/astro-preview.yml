name: Build Astro website preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/cloudflare.gemfile
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _astro_preview/package-lock.json
      - name: Install Astro dependencies
        working-directory: _astro_preview
        run: npm ci
      - name: Build Astro preview
        working-directory: _astro_preview
        run: npm run build
      - name: Validate documentation parity and preview safety
        working-directory: _astro_preview
        run: npm run check:docs
      - uses: actions/upload-artifact@v4
        with:
          name: astro-website-preview
          path: _astro_preview/dist/
          retention-days: 7
          if-no-files-found: error
