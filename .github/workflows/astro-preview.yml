name: Build Astro website preview

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Upload to the Cloudflare Pages preview project named in _astro_preview/wrangler.toml
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astro-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/cloudflare.gemfile
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _astro_preview/package-lock.json
      - name: Install Astro dependencies
        working-directory: _astro_preview
        run: npm ci
      - name: Build Astro preview
        working-directory: _astro_preview
        run: npm run build
      - name: Validate documentation parity and preview safety
        working-directory: _astro_preview
        run: npm run check:docs
      - uses: actions/upload-artifact@v4
        with:
          name: astro-website-preview
          path: _astro_preview/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_preview
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-astro-upload
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: _astro_preview
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: _astro_preview
      - uses: actions/download-artifact@v4
        with:
          name: astro-website-preview
          path: _astro_preview/dist
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _astro_preview/package-lock.json
      - run: npm ci
      - name: Confirm preview target
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          import urllib.request

          with open("wrangler.toml", "rb") as config:
              project = tomllib.load(config)["name"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          if not re.fullmatch(r"[a-fA-F0-9]{32}", account) or not token:
              raise SystemExit("Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare-preview environment.")
          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if not payload.get("success"):
              raise SystemExit(f"Could not verify the Cloudflare Pages project {project}.")
          target = payload["result"]
          if any(not domain.endswith(".pages.dev") for domain in target.get("domains", [])):
              raise SystemExit(f"{project} has a custom domain; use a preview-only project.")
          if target.get("production_branch") == "migration-preview":
              raise SystemExit("migration-preview must not be the production branch.")
          PY
      - name: Deploy preview
        run: npx wrangler pages deploy --branch=migration-preview
